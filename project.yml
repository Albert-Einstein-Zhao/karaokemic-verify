name: KaraokeMicVerify
options:
  bundleIdPrefix: com.xuebao
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # 不填 Team，用免费 Apple ID 签名（7 天有效期，够验证用）
    DEVELOPMENT_TEAM: ""

# 显式声明 scheme，否则 GitHub Actions 上找不到可构建的 scheme
schemes:
  KaraokeMicVerify:
    build:
      targets:
        KaraokeMicVerify: all
    run:
      config: Debug
  # ★ 正式版（2026-10-09 第二十四轮接入 CI）：
  #   验证版负责定位问题，问题修完同步回正式版，由 CI 出正式版 IPA。
  KaraokeMic:
    build:
      targets:
        KaraokeMic: all
    run:
      config: Debug

targets:
  KaraokeMicVerify:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuebao.karamic.verify
        PRODUCT_NAME: KaraokeMicVerify
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: KaraokeMicVerify/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        #★★ 必须用 -O，不能用 -Onone
        # NLMS 回声消除（滤波器长度 512）、8 路自适应陷波器、FFT 趋势检测
        # 全跑在 5ms 一帧的实时音频回调里。-Onone 下 Swift 数组拷贝和循环都不会
        # 被优化掉，实测会让音频线程直接欠载（爆音），ERLE 测出来是假的。
        # 这台机器 CPU 比 iPhone 强，但编译期优化对实时 DSP 是硬要求，不是可选项。
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        # 音频处理链路的数学运算需要快速数学（vDSP/sin/exp），
        # 否则 Reverb 的梳状滤波器和 Biquad 在每帧都成为 CPU 热点
        OTHER_SWIFT_FLAGS: "$(inherited) -D RELEASE_BUILD"
        ENABLE_TESTABILITY: NO
        SWIFT_COMPILATION_MODE: wholemodule
        # 让 SwiftUI 预渲染的性能优化生效
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

    sources:
      - path: KaraokeMicVerify
        excludes:
          - "Resources/Info.plist"

  # ════════════════════════════════════════════════════════════════════
  #  正式版 target（2026-10-09 第二十四轮接入 CI）
  # ════════════════════════════════════════════════════════════════════
  #  与验证版的差别：
  #   · 源码在 KaraokeMic/（多 HomeView/StudioView/SettingsView 三页 UI）
  #   · Bundle ID 是 com.xuebao.karamic（正式 ID，不再带 .verify 后缀）
  #   · 显示名「K歌麦」
  #   · 编译设置与验证版完全一致（-O 优化对实时 DSP 是硬要求）
  KaraokeMic:
    type: application
    platform: iOS
    # ★ 16.0（CI 首次编译抓出）：正式版 UI 用了 NavigationStack /
    #   toolbarBackground 等 iOS 16 API。验证版仍保持 15.0 不受影响。
    deploymentTarget: "16.0"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuebao.karamic
        PRODUCT_NAME: KaraokeMic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: KaraokeMic/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # 与验证版同理：NLMS/陷波器/FFT 跑在 5ms 实时回调里，必须 -O
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        OTHER_SWIFT_FLAGS: "$(inherited) -D RELEASE_BUILD"
        ENABLE_TESTABILITY: NO
        SWIFT_COMPILATION_MODE: wholemodule
        # ★ 应用图标：AppIcon.appiconset（单尺寸 1024，AI 生成后抠白处理）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    sources:
      - path: KaraokeMic
        excludes:
          - "Resources/Info.plist"